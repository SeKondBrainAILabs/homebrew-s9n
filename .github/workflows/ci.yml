name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -s sh install.sh install-kemory.sh

  formula:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, formula: s9n }             # Apple Silicon
          - { os: macos-14, formula: kemory }          # Apple Silicon
          - { os: macos-15-intel, formula: kemory }    # Intel (same runner the kemory release build uses)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Lint formula style (informational)
        continue-on-error: true
        run: brew style Formula/${{ matrix.formula }}.rb
      - name: Install + test the formula end-to-end
        run: |
          # Modern Homebrew only installs formulae from a tap, so expose this
          # checkout as the tap, then install + run its test block. `brew
          # install` runs the formula's `install` block (completion generation
          # included), so a bad post-install step fails the job here.
          tap="$(brew --repository)/Library/Taps/sekondbrainailabs/homebrew-s9n"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew install sekondbrainailabs/s9n/${{ matrix.formula }}
          ${{ matrix.formula }} --version
          brew test ${{ matrix.formula }}

  # The installer scripts are fetched and executed on user machines, and until
  # now nothing ran them — shellcheck reads install.sh without executing it, and
  # install.ps1 had no coverage at all. These jobs install from the scripts in
  # this checkout and assert the binary they produce actually runs.
  installer-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        product:
          - { script: install.sh, bin: s9n }
          - { script: install-kemory.sh, bin: kemory }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from this checkout's ${{ matrix.product.script }}
        # Without a token the script's version lookup hits the unauthenticated
        # GitHub API limit (60/hour per IP) and curl exits 56 on the 403. The
        # macOS runners share egress addresses and hit it routinely.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh ./${{ matrix.product.script }}
      - name: The installed launcher runs
        run: |
          "$HOME/.local/bin/${{ matrix.product.bin }}" --version

  installer-windows:
    strategy:
      fail-fast: false
      matrix:
        product:
          - { script: install.ps1, dir: s9n, exe: s9n.exe }
          - { script: install-kemory.ps1, dir: kemory, exe: kemory.exe }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint ${{ matrix.product.script }}
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          # Errors fail the job; warnings are printed but tolerated, matching how
          # much of PSScriptAnalyzer's default rule set is stylistic.
          $found = Invoke-ScriptAnalyzer -Path ./${{ matrix.product.script }} -Severity Error,Warning
          $found | Format-Table -AutoSize | Out-String | Write-Host
          if ($found | Where-Object { $_.Severity -eq 'Error' }) {
            Write-Host "::error::PSScriptAnalyzer reported errors in ${{ matrix.product.script }}"
            exit 1
          }
      - name: Install from this checkout's ${{ matrix.product.script }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./${{ matrix.product.script }}
      - name: The installed exe runs
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Programs\${{ matrix.product.dir }}\current\${{ matrix.product.exe }}" --version

  # One stable check name for branch protection to require.
  #
  # The `formula` job names are matrix-derived — `formula (macos-14, kemory)`,
  # `formula (macos-15-intel, kemory)` — so requiring those directly means any
  # edit to the matrix silently orphans the required check and the branch stops
  # being gated at all. This job's name never changes.
  ci-ok:
    # `always()` is required: without it a failed dependency SKIPS this job, and
    # branch protection counts a skipped required check as satisfied.
    if: always()
    needs: [shellcheck, formula, installer-posix, installer-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        env:
          # Via env rather than inline `${{ }}` in the script — expressions
          # interpolated straight into a `run:` block are executed as shell.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependency results: $RESULTS"
          # A gate handed no input is not a passing gate. Without this, dropping
          # entries from `needs:` above would leave a green required check that
          # checks nothing.
          if [ -z "$RESULTS" ]; then
            echo "::error::no dependency results — this gate is not gating anything"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required ci job did not succeed (saw '$result')"
              exit 1
            fi
          done
